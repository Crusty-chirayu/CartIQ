<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Animated mock of the CartIQ conversational shopping assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a1a22"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
    .h{font-size:17px;font-weight:700;fill:#f1f5f9}
    .m{font-size:18px;fill:#f8fafc}
    .s{font-size:13px;fill:#94a3b8}
    .c1{font-size:16px;font-weight:700;fill:#f1f5f9}
    .badge{font-size:12px;font-weight:700;fill:#5eead4}
    .e{opacity:0}
    .e1{animation:e1 18s infinite}
    .e2{animation:e2 18s infinite}
    .e3{animation:e3 18s infinite}
    .e4{animation:e4 18s infinite}
    .e5{animation:e5 18s infinite}
    .e6{animation:e6 18s infinite}
    .e7{animation:e7 18s infinite}
    .e8{animation:e8 18s infinite}
    .e9{animation:e9 18s infinite}
    @keyframes e1{0%,3%{opacity:0;transform:translateY(14px)}6%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e2{0%,9%{opacity:0}11%,19%{opacity:1}21%,100%{opacity:0}}
    @keyframes e3{0%,21%{opacity:0;transform:translateY(14px)}25%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e4{0%,29%{opacity:0;transform:translateY(18px)}34%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e5{0%,35%{opacity:0;transform:translateY(18px)}40%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e6{0%,41%{opacity:0;transform:translateY(18px)}46%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e7{0%,58%{opacity:0;transform:translateY(14px)}62%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    @keyframes e8{0%,68%{opacity:0}70%,76%{opacity:1}78%,100%{opacity:0}}
    @keyframes e9{0%,78%{opacity:0;transform:translateY(14px)}82%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
    .d{animation:bounce 1s infinite ease-in-out}
    .d2{animation-delay:.15s}.d3{animation-delay:.3s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
    .live{animation:live 1.8s infinite}
    @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
    .hl{animation:hl 18s infinite}
    @keyframes hl{0%,50%{stroke-opacity:.18}54%,60%{stroke-opacity:1}64%,100%{stroke-opacity:.18}}
  </style>

  <rect width="960" height="600" rx="26" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="880" height="540" rx="22" fill="#111827" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <!-- window chrome -->
  <circle cx="72" cy="62" r="6" fill="#f87171"/><circle cx="94" cy="62" r="6" fill="#fbbf24"/><circle cx="116" cy="62" r="6" fill="#34d399"/>
  <text x="480" y="68" text-anchor="middle" class="h">CartIQ Assistant</text>
  <circle cx="852" cy="62" r="5" fill="#2dd4bf" class="live"/>
  <text x="866" y="67" class="s">online</text>
  <line x1="40" y1="88" x2="920" y2="88" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- user msg 1 -->
  <g class="e e1">
    <rect x="470" y="108" width="426" height="50" rx="18" fill="url(#brand)"/>
    <text x="494" y="140" class="m">I need a laptop for coding under 70,000</text>
  </g>

  <!-- typing dots -->
  <g class="e e2">
    <rect x="64" y="176" width="86" height="42" rx="16" fill="#1f2937"/>
    <circle cx="90" cy="197" r="4.5" fill="#94a3b8" class="d"/>
    <circle cx="107" cy="197" r="4.5" fill="#94a3b8" class="d d2"/>
    <circle cx="124" cy="197" r="4.5" fill="#94a3b8" class="d d3"/>
  </g>

  <!-- assistant reply -->
  <g class="e e3">
    <rect x="64" y="176" width="520" height="50" rx="18" fill="#1f2937"/>
    <text x="88" y="208" class="m">Found 3 strong matches for your budget and workload:</text>
  </g>

  <!-- product cards (illustrative) -->
  <g class="e e4">
    <rect x="64" y="244" width="266" height="160" rx="16" fill="#0f172a" stroke="#6366f1" stroke-opacity=".5" class="hl"/>
    <rect x="80" y="260" width="234" height="62" rx="10" fill="#1e293b"/>
    <rect x="148" y="272" width="98" height="38" rx="5" fill="#334155"/>
    <rect x="132" y="310" width="130" height="5" rx="2.5" fill="#475569"/>
    <text x="80" y="346" class="c1">Dev Laptop 14</text>
    <text x="80" y="368" class="s">16 GB RAM - 512 GB SSD</text>
    <text x="80" y="392" class="badge">96% MATCH</text>
  </g>
  <g class="e e5">
    <rect x="347" y="244" width="266" height="160" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="363" y="260" width="234" height="62" rx="10" fill="#1e293b"/>
    <rect x="431" y="272" width="98" height="38" rx="5" fill="#334155"/>
    <rect x="415" y="310" width="130" height="5" rx="2.5" fill="#475569"/>
    <text x="363" y="346" class="c1">Slim Pro 15</text>
    <text x="363" y="368" class="s">16 GB RAM - 1 TB SSD</text>
    <text x="363" y="392" class="badge">91% MATCH</text>
  </g>
  <g class="e e6">
    <rect x="630" y="244" width="266" height="160" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="646" y="260" width="234" height="62" rx="10" fill="#1e293b"/>
    <rect x="714" y="272" width="98" height="38" rx="5" fill="#334155"/>
    <rect x="698" y="310" width="130" height="5" rx="2.5" fill="#475569"/>
    <text x="646" y="346" class="c1">Budget Coder</text>
    <text x="646" y="368" class="s">8 GB RAM - 512 GB SSD</text>
    <text x="646" y="392" class="badge">87% MATCH</text>
  </g>

  <!-- user msg 2 -->
  <g class="e e7">
    <rect x="560" y="424" width="336" height="46" rx="18" fill="url(#brand)"/>
    <text x="584" y="454" class="m">Add the first one to my cart</text>
  </g>

  <!-- typing 2 -->
  <g class="e e8">
    <rect x="64" y="484" width="86" height="42" rx="16" fill="#1f2937"/>
    <circle cx="90" cy="505" r="4.5" fill="#94a3b8" class="d"/>
    <circle cx="107" cy="505" r="4.5" fill="#94a3b8" class="d d2"/>
    <circle cx="124" cy="505" r="4.5" fill="#94a3b8" class="d d3"/>
  </g>

  <!-- assistant reply 2 -->
  <g class="e e9">
    <rect x="64" y="484" width="560" height="50" rx="18" fill="#1f2937"/>
    <text x="88" y="516" class="m">Added to your cart. Want a matching laptop bag?</text>
  </g>

  <text x="480" y="590" text-anchor="middle" class="s" opacity=".7">Illustrative mock of the conversational flow</text>
</svg>
