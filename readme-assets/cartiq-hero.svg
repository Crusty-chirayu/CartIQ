<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="CartIQ - AI-powered e-commerce platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1f"/>
      <stop offset="0.55" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#062a2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>

  <style>
    .title{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:118px;letter-spacing:-4px}
    .sub{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:30px;font-weight:500;fill:#cbd5e1}
    .pilltxt{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;font-size:17px;font-weight:600;fill:#e2e8f0}
    .tag{opacity:0}
    .t1{animation:t1 12s infinite}
    .t2{animation:t2 12s infinite}
    .t3{animation:t3 12s infinite}
    @keyframes t1{0%{opacity:0;transform:translateY(10px)}4%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-10px)}}
    @keyframes t2{0%,33%{opacity:0;transform:translateY(10px)}37%,61%{opacity:1;transform:none}66%,100%{opacity:0;transform:translateY(-10px)}}
    @keyframes t3{0%,66%{opacity:0;transform:translateY(10px)}70%,94%{opacity:1;transform:none}99%,100%{opacity:0;transform:translateY(-10px)}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>

    <!-- drifting aurora orbs -->
    <circle r="200" fill="#6366f1" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cx" values="160;420;160" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;300;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="220" fill="#14b8a6" opacity="0.32" filter="url(#blur)">
      <animate attributeName="cx" values="1120;820;1120" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;120;360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="140" fill="#a78bfa" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="640;720;640" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;60;420" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="90" cy="70" r="2" class="pulse"/>
      <circle cx="260" cy="380" r="2.5" class="pulse" style="animation-delay:.6s"/>
      <circle cx="540" cy="48" r="2" class="pulse" style="animation-delay:1.1s"/>
      <circle cx="930" cy="62" r="2.5" class="pulse" style="animation-delay:.3s"/>
      <circle cx="1190" cy="210" r="2" class="pulse" style="animation-delay:1.6s"/>
      <circle cx="1010" cy="400" r="2" class="pulse" style="animation-delay:.9s"/>
    </g>

    <!-- cart emblem -->
    <g class="float" transform="translate(150 150)">
      <g filter="url(#glow)">
        <rect x="-62" y="-62" width="124" height="124" rx="32" fill="url(#pill)" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="1.5"/>
        <path d="M-34 -30h12l8 40h38l8-30h-50" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-8" cy="30" r="6" fill="#2dd4bf"/>
        <circle cx="26" cy="30" r="6" fill="#818cf8"/>
        <!-- AI spark -->
        <path d="M30 -38l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fde68a">
          <animateTransform attributeName="transform" type="rotate" from="0 30 -28" to="360 30 -28" dur="8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- wordmark -->
    <text x="250" y="205" class="title" fill="url(#brand)">CartIQ</text>

    <!-- rotating tagline -->
    <g transform="translate(256 262)">
      <text class="sub tag t1">Shop by talking. Skip the filters.</text>
      <text class="sub tag t2">Recommendations that actually know you.</text>
      <text class="sub tag t3">One platform. Storefront to admin dashboard.</text>
    </g>

    <!-- stack pills -->
    <g transform="translate(256 320)">
      <rect width="150" height="42" rx="21" fill="url(#pill)" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="75" y="27" text-anchor="middle" class="pilltxt">Next.js 16</text>
      <rect x="164" width="130" height="42" rx="21" fill="url(#pill)" stroke="#818cf8" stroke-opacity=".45"/>
      <text x="229" y="27" text-anchor="middle" class="pilltxt">React 19</text>
      <rect x="308" width="150" height="42" rx="21" fill="url(#pill)" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="383" y="27" text-anchor="middle" class="pilltxt">TypeScript</text>
      <rect x="472" width="150" height="42" rx="21" fill="url(#pill)" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="547" y="27" text-anchor="middle" class="pilltxt">Supabase</text>
      <rect x="636" width="150" height="42" rx="21" fill="url(#pill)" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="711" y="27" text-anchor="middle" class="pilltxt">AI Concierge</text>
    </g>

    <!-- border -->
    <rect x="1" y="1" width="1278" height="438" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>
</svg>
